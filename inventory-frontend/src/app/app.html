<div class="app-frame">
  <aside class="sidebar" [class.sidebar-open]="menuOpen()">
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
      <span class="brand-mark">R</span>
      <span class="brand-copy"><strong>RetailOps</strong><small>INVENTORY CONTROL</small></span>
    </a>
    <div class="nav-caption">WORKSPACE</div>
    <nav class="primary-nav" aria-label="Main navigation">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">◫</span>Dashboard</a>
      <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">▦</span>Products</a>
      <a routerLink="/inventory" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">▤</span>Inventory</a>
      <a routerLink="/stock-operations" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">⇄</span>Stock operations</a>
      <a routerLink="/suppliers" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">⌂</span>Suppliers</a>
      <a routerLink="/warehouses" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">▥</span>Warehouses</a>
      <a routerLink="/orders" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon">≡</span>Orders</a>
    </nav>
    <div class="sidebar-bottom"><span class="live-dot"></span><span><strong>API connection</strong><small>localhost:8080</small></span></div>
  </aside>

  @if (menuOpen()) {
    <button class="mobile-scrim" type="button" aria-label="Close navigation" (click)="closeMenu()"></button>
  }

  <div class="workspace">
    <header class="topbar">
      <button class="menu-toggle" type="button" aria-label="Toggle navigation" (click)="menuOpen.set(!menuOpen())">☰</button>
      <div class="topbar-context"><span>RETAIL OPERATIONS</span><strong>Inventory management</strong></div>
      <div class="topbar-right"><span class="date-stamp">{{ today | date:'EEE, MMM d' }}</span><span class="avatar">RO</span></div>
    </header>
    <main class="main-content"><router-outlet /></main>
    <footer class="app-footer"><span>RetailOps inventory</span><span>Spring Boot API · localhost:8080</span></footer>
  </div>
  <app-toast />
</div>
